[project]
name = "noto-emoji-win"
version = "0.1.0"
description = "Convert Google Noto Color Emoji into a Windows Segoe UI Emoji replacement"
requires-python = ">=3.11"
dependencies = [
  "fonttools>=4.59,<5",
]

[project.scripts]
noto-emoji-win = "emoji_win.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emoji_win"]
